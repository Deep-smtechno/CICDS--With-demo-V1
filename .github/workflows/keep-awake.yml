name: Keep Render App Awake

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API to keep awake
        run: |
          # Replace the URL below with your actual Render API URL or Website URL
          curl -s https://your-render-app-url.onrender.com > /dev/null
          echo "Pinged the app successfully!"
